<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <title>Dark topographic portfolio background</title>
  <desc>Quiet navy background with low-contrast contour lines kept around the edges, leaving the center clear for website content.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111923"/>
      <stop offset="0.68" stop-color="#121A24"/>
      <stop offset="1" stop-color="#15181D"/>
    </linearGradient>
    <radialGradient id="centerQuiet" cx="0" cy="0" r="1" gradientTransform="translate(960 470) rotate(90) scale(620 980)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17212C" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#17212C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#17212C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottomFade" x1="960" y1="730" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15181D" stop-opacity="0"/>
      <stop offset="1" stop-color="#15181D"/>
    </linearGradient>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#centerQuiet)"/>

